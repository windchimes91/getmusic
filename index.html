<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YouTube 音訊下載器</title>
</head>
<body>
    <h1>YouTube 音訊下載器</h1>

    <!-- 顯示通知訊息 -->
    {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        <ul>
        {% for category, message in messages %}
            <li style="color: {{ 'red' if category == 'error' else 'green' }};">{{ message }}</li>
        {% endfor %}
        </ul>
    {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="url">請輸入 YouTube 視頻 URL：</label>
        <input type="text" id="url" name="url" required><br><br>

        <label for="custom_name">自定義檔案名稱（可選）：</label>
        <input type="text" id="custom_name" name="custom_name" placeholder="輸入檔案名稱"><br><br>

        <button type="submit">下載 MP3</button>
    </form>
</body>
</html>
